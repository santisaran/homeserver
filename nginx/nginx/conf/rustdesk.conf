# ─── RustDesk web client ──────────────────────────────────────────────────────
# TCP/UDP principales (21115-21117) van directo, no pasan por nginx.
# hbbs (21118): maneja API y websocket de IDs
# hbbr (21119): websocket de relay
server {
    listen 443 ssl;
    server_name rustdesk.terispi.duckdns.org;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    # API y websocket de IDs → hbbs
    location /api/ {
        proxy_pass http://host.docker.internal:21118;
        include /etc/nginx/conf.d/snippets/proxy_headers.conf;
    }

    location /ws/id {
        proxy_pass http://host.docker.internal:21118;
        include /etc/nginx/conf.d/snippets/proxy_headers.conf;
    }

    # Websocket relay → hbbr
    location /ws/relay {
        proxy_pass http://host.docker.internal:21119;
        include /etc/nginx/conf.d/snippets/proxy_headers.conf;
    }
}
