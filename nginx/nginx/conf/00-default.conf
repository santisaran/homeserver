# ─── Server por defecto ───────────────────────────────────────────────────────
# Captura cualquier host que NO matchee ningún server_name, para no depender del
# orden de carga de los .conf. Cierra la conexión sin responder.
server {
    listen 443 ssl default_server;
    server_name _;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    return 444;
}
