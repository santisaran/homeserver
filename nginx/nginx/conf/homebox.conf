# ─── Homebox (Inventario) ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name inventario.terispi.duckdns.org;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    client_max_body_size 50M;

    location / {
        proxy_pass http://host.docker.internal:7745;
        include /etc/nginx/conf.d/snippets/proxy_headers.conf;
    }
}
