esphome:
  name: espi
  friendly_name: espitests00
  min_version: 2025.5.0
  name_add_mac_suffix: false
  area: living

esp32:
  board: esp32dev
  framework:
    type: esp-idf
  variant: ESP32

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "devkit Fallback Hotspot"
    password: !secret wifi_ap_password

remote_transmitter:
  - id: remote_transmitter_1
    pin: GPIO23
    carrier_duty_percent: 100%
    clock_resolution: 1000000
    non_blocking: true

script:
  - id: send_rf_porton
    parameters:
      code_str: string
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            std::vector<int32_t> raw;
            raw.reserve(code_str.size() * 2);
            for (char c : code_str) {
              if (c == '0') {
                // 0: 500ms con señal, 1000ms sin señal
                raw.push_back(-1000); // LOW
                raw.push_back(500);   // HIGH
              } else {
                // 1: 1000ms con señal, 500ms sin señal
                raw.push_back(-500);  // LOW
                raw.push_back(1000);  // HIGH
              }
            }
            return raw;
          repeat:
            times: 5
            wait_time: 10ms

  - id: send_rf_custom
    parameters:
      code_str: string
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            std::vector<int32_t> raw;
            raw.reserve(code_str.size() * 2);
            for (char c : code_str) {
              if (c == '0') {
                raw.push_back(250);
                raw.push_back(-750);
              } else {
                raw.push_back(750);
                raw.push_back(-250);
              }
            }
            return raw;
          repeat:
            times: 5
            wait_time: 7.5ms

# Componente Ventilador para Home Assistant
fan:
  - platform: template
    id: ventilador_pieza_adultos
    name: "Ventilador"
    icon: "mdi:fan"
    speed_count: 6
    has_direction: true
    restore_mode: ALWAYS_OFF
    
    on_turn_on:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_fan_on

    on_turn_off:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_fan_off

    on_speed_set:
      - if:
          condition:
            lambda: 'return x == 1;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_1
      - if:
          condition:
            lambda: 'return x == 2;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_2
      - if:
          condition:
            lambda: 'return x == 3;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_3
      - if:
          condition:
            lambda: 'return x == 4;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_4
      - if:
          condition:
            lambda: 'return x == 5;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_5
      - if:
          condition:
            lambda: 'return x == 6;'
          then:
            - script.execute:
                id: send_rf_custom
                code_str: !secret rf_fan_speed_6
          
# Botones adicionales del ventilador y control de luz
button:
  # Apagado total
  - platform: template
    name: "Ventilador Apagar Todo"
    icon: "mdi:power"
    on_press:
      - fan.turn_off: ventilador_pieza_adultos
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_fan_all_off

  # Controles de Luz
  - platform: template
    name: "Luz Interruptor"
    icon: "mdi:lightbulb-toggle"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_light_switch

  - platform: template
    name: "Luz Bajar Brillo"
    icon: "mdi:brightness-5"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_light_down

  - platform: template
    name: "Luz Subir Brillo"
    icon: "mdi:brightness-7"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_light_up

  - platform: template
    name: "Luz Cambiar Color"
    icon: "mdi:palette"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_light_color

  # Temporizadores
  - platform: template
    name: "Temporizador 1h"
    icon: "mdi:timer-sand"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_timer_1h

  - platform: template
    name: "Temporizador 4h"
    icon: "mdi:timer-sand"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: !secret rf_timer_4h

  - platform: template
    name: "Porton"
    icon: "mdi:gate"
    on_press:
      - script.execute:
          id: send_rf_porton
          code_str: !secret ID_RF_PORTON

web_server:
  auth:
    password: !secret web_password
    username: saran