esphome:
  name: espi
  friendly_name: espitests00
  min_version: 2025.5.0
  name_add_mac_suffix: false
  area: living

esp32:
  board: esp32dev
  framework:
    type: esp-idf
  variant: ESP32

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "devkit Fallback Hotspot"
    password: !secret wifi_ap_password

remote_transmitter:
  - id: remote_transmitter_1
    pin: GPIO23
    carrier_duty_percent: 100%
    clock_resolution: 1000000
    non_blocking: true


script:
  - id: send_rf_custom
    parameters:
      code_str: string
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            std::vector<int32_t> raw;
            raw.reserve(code_str.size() * 2);
            for (char c : code_str) {
              if (c == '0') {
                raw.push_back(250);
                raw.push_back(-750);
              } else {
                raw.push_back(750);
                raw.push_back(-250);
              }
            }
            return raw;
          repeat:
            times: 5
            wait_time: 7.5ms
# Componente Ventilador para Home Assistant
fan:
  - platform: template
    id: ventilador_pieza_adultos
    name: "Ventilador"
    icon: "mdi:fan"
    speed_count: 6
    has_direction: true
    
    on_turn_on:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101101000011000010"

    on_turn_off:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101101011010000000"

    on_speed_set:
      - script.execute:
          id: send_rf_custom
          code_str: !lambda |-
            switch (x) {
              case 1: return "100100000111110101101000011000010";
              case 2: return "100100000111110101101001011100010";
              case 3: return "100100000111110101101110000000010";
              case 4: return "100100000111110101100101000110110";
              case 5: return "100100000111110101100111101000100";
              case 6: return "100100000111110101100110001110100";
              default: return "100100000111110101101000011000010";
            }
          
# Botones adicionales del ventilador y control de luz
button:
  # Apagado total
  - platform: template
    name: "Ventilador Apagar Todo"
    icon: "mdi:power"
    on_press:
      - fan.turn_off: ventilador_pieza_adultos
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101100011000111010" # all_off

  # Controles de Luz
  - platform: template
    name: "Luz Interruptor"
    icon: "mdi:lightbulb-toggle"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101100100001010010" # light_switch

  - platform: template
    name: "Luz Bajar Brillo"
    icon: "mdi:brightness-5"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101100010001111100" # light-down

  - platform: template
    name: "Luz Subir Brillo"
    icon: "mdi:brightness-7"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101101000110110100" # light-up

  - platform: template
    name: "Luz Cambiar Color"
    icon: "mdi:palette"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101101010110010010" # light-color

  # Temporizadores
  - platform: template
    name: "Temporizador 1h"
    icon: "mdi:timer-sand"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101100001010110110" # 1h

  - platform: template
    name: "Temporizador 4h"
    icon: "mdi:timer-sand"
    on_press:
      - script.execute:
          id: send_rf_custom
          code_str: "100100000111110101101100111111000" # 4h